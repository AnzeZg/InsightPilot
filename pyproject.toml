[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightpilot"
version = "0.1.0"
description = "A market research tool that uses LLMs to conduct interviews"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "InsightPilot Team"}
]
keywords = ["market-research", "llm", "interviews", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "jinja2==3.1.4",
    "python-multipart==0.0.12",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "pydantic[email]==2.10.3",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==23.1.0",
    "itsdangerous==2.2.0",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "email-validator==2.2.0",
    "openai>=1.0.0",
    "vaderSentiment==3.3.2",
    "yake==0.4.8",
    "prometheus-client==0.21.0",
    "prometheus-fastapi-instrumentator==7.0.0",
    "opencensus-ext-azure>=1.1.13",
    "opencensus-ext-flask>=0.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==7.0.0",
    "black==24.10.0",
    "isort==5.13.2",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | alembic/versions
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "__pycache__", "alembic/versions"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]  # SQLAlchemy forward references
"tests/conftest.py" = ["N806"]  # Test fixtures can use PascalCase

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vaderSentiment.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yake.*"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*", "venv*"]
