# Prometheus alerting rules for InsightPilot

groups:
  - name: insightpilot_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # Slow response time
      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile response time is high"
          description: "P95 response time is {{ $value }}s (threshold: 2s)"

      # Database connection issues
      - alert: DatabaseConnectionError
        expr: |
          sum(increase(db_errors_total[5m])) > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection errors detected"
          description: "{{ $value }} database errors in the last 5 minutes"

      # High AI request failure rate
      - alert: HighAIRequestFailureRate
        expr: |
          (
            sum(rate(ai_requests_total{status="error"}[5m]))
            /
            sum(rate(ai_requests_total[5m]))
          ) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High AI request failure rate"
          description: "AI request failure rate is {{ $value | humanizePercentage }} (threshold: 10%)"

      # Service down
      - alert: ServiceDown
        expr: up{job="insightpilot-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "InsightPilot service is down"
          description: "The InsightPilot application is not responding"

      # High memory usage (if node exporter is added)
