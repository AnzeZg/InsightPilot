name: CD - Build & Deploy to Azure

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  DOCKER_IMAGE_NAME: insightpilot
  AZURE_WEBAPP_NAME: azgonc-insightpilot
  ACR_LOGIN_SERVER: azgoncinsightpilotacr.azurecr.io

jobs:
  # Run tests first to ensure code quality before deploying
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check app/ tests/ --output-format=github

      - name: Check Ruff formatting
        run: ruff format app/ tests/ --check

      - name: Check import sorting
        run: isort app/ tests/ --check

      - name: Run tests with coverage
        env:
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./test.db
          OPENAI_API_KEY: sk-test-key-for-ci
        run: |
          pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            -v

      - name: Check coverage threshold (70%)
        run: |
          coverage_percent=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.attrib['line-rate']) * 100)")
          echo "Coverage: $coverage_percent%"
          if (( $(echo "$coverage_percent < 70" | bc -l) )); then
            echo "❌ Coverage $coverage_percent% is below threshold 70%"
            exit 1
          fi
          echo "✅ Coverage meets threshold"

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ github.run_number }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    # Only deploy on push to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Web App settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {
                "name": "WEBSITES_ENABLE_APP_SERVICE_STORAGE",
                "value": "false"
              },
              {
                "name": "DOCKER_REGISTRY_SERVER_URL",
                "value": "https://${{ env.ACR_LOGIN_SERVER }}"
              },
              {
                "name": "DOCKER_REGISTRY_SERVER_USERNAME",
                "value": "${{ secrets.ACR_USERNAME }}"
              },
              {
                "name": "DOCKER_REGISTRY_SERVER_PASSWORD",
                "value": "${{ secrets.ACR_PASSWORD }}"
              },
              {
                "name": "DOCKER_ENABLE_CI",
                "value": "true"
              },
              {
                "name": "DATABASE_URL",
                "value": "${{ secrets.DATABASE_URL }}",
                "slotSetting": false
              },
              {
                "name": "OPENAI_API_KEY",
                "value": "${{ secrets.OPENAI_API_KEY }}",
                "slotSetting": false
              },
              {
                "name": "SECRET_KEY",
                "value": "${{ secrets.SECRET_KEY }}",
                "slotSetting": false
              },
              {
                "name": "ENVIRONMENT",
                "value": "production"
              },
              {
                "name": "APPINSIGHTS_INSTRUMENTATION_KEY",
                "value": "${{ secrets.APPINSIGHTS_INSTRUMENTATION_KEY }}",
                "slotSetting": false
              },
              {
                "name": "APPINSIGHTS_INSTRUMENTATION_KEY",
                "value": "${{ secrets.APPINSIGHTS_INSTRUMENTATION_KEY }}",
                "slotSetting": false
              }
            ]

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Health check
        run: |
          echo "Checking health endpoint..."
          max_attempts=10
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/healthz || echo "000")

            if [ "$response" = "200" ]; then
              echo "✅ Health check passed!"
              exit 0
            fi

            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: HTTP $response - waiting 10s..."
            sleep 10
          done

          echo "❌ Health check failed after $max_attempts attempts"
          exit 1

  smoke-tests:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy
    # Only run after successful deployment (main branch only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Test API documentation
        run: |
          echo "Testing API docs endpoint..."
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/docs

      - name: Test OpenAPI schema
        run: |
          echo "Testing OpenAPI schema..."
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/openapi.json

      - name: All smoke tests passed
        run: echo "✅ All smoke tests passed!"
