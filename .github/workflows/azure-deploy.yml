name: CI/CD Pipeline

# Workflow behavior:
# - Pull Requests: Run tests, linting, and build Docker image (validation only, no push/deploy)
# - Push to main: Run tests, linting, build + push Docker image, deploy to Azure, run smoke tests
# - Manual: Can be triggered manually via workflow_dispatch

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggers

env:
  PYTHON_VERSION: '3.13'
  DOCKER_IMAGE_NAME: insightpilot
  AZURE_WEBAPP_NAME: azgonc-insightpilot
  ACR_LOGIN_SERVER: azgoncinsightpilotacr.azurecr.io

jobs:
  # ============================================================================
  # JOB 1: CODE QUALITY & TESTING
  # ============================================================================
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: |
          echo "Running Ruff linter..."
          ruff check app/ tests/ --output-format=github

      - name: Check Ruff formatting
        run: |
          echo "Checking code formatting..."
          ruff format app/ tests/ --check

      - name: Check import sorting
        run: |
          echo "Checking import sorting..."
          isort app/ tests/ --check

      - name: Run tests with coverage
        env:
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./test.db
          OPENAI_API_KEY: sk-test-key-for-ci
        run: |
          pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term \
            --junitxml=test-results.xml \
            -v

      - name: Check coverage threshold (70%)
        run: |
          coverage_percent=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.attrib['line-rate']) * 100)")
          echo "Coverage: $coverage_percent%"
          if (( $(echo "$coverage_percent < 70" | bc -l) )); then
            echo "❌ Coverage $coverage_percent% is below threshold 70%"
            exit 1
          fi
          echo "✅ Coverage meets threshold"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ============================================================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # ============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    # Build on PRs to validate, build+push on main
    if: success()

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            # Always publish a deterministic build tag (build-<short-sha>)
            type=sha,prefix=build-,format=short
            # Tag with branch name when available (sanitized automatically)
            type=ref,event=branch
            # Tag Git tags explicitly (useful for releases)
            type=ref,event=tag
            # Latest tag only on default branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Only push on main branch, just build on PRs
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ github.run_number }}

  # ============================================================================
  # JOB 3: DEPLOY TO AZURE APP SERVICE
  # ============================================================================
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    # Only deploy on push to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Web App settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {
                "name": "WEBSITES_ENABLE_APP_SERVICE_STORAGE",
                "value": "false"
              },
              {
                "name": "DOCKER_REGISTRY_SERVER_URL",
                "value": "https://${{ env.ACR_LOGIN_SERVER }}"
              },
              {
                "name": "DOCKER_REGISTRY_SERVER_USERNAME",
                "value": "${{ secrets.ACR_USERNAME }}"
              },
              {
                "name": "DOCKER_REGISTRY_SERVER_PASSWORD",
                "value": "${{ secrets.ACR_PASSWORD }}"
              },
              {
                "name": "DOCKER_ENABLE_CI",
                "value": "true"
              },
              {
                "name": "DATABASE_URL",
                "value": "${{ secrets.DATABASE_URL }}",
                "slotSetting": false
              },
              {
                "name": "OPENAI_API_KEY",
                "value": "${{ secrets.OPENAI_API_KEY }}",
                "slotSetting": false
              },
              {
                "name": "SECRET_KEY",
                "value": "${{ secrets.SECRET_KEY }}",
                "slotSetting": false
              },
              {
                "name": "ENVIRONMENT",
                "value": "production"
              },
              {
                "name": "APPINSIGHTS_INSTRUMENTATION_KEY",
                "value": "${{ secrets.APPINSIGHTS_INSTRUMENTATION_KEY }}",
                "slotSetting": false
              }
            ]

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          echo "Checking health endpoint..."
          max_attempts=10
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/healthz || echo "000")

            if [ "$response" = "200" ]; then
              echo "✅ Health check passed!"
              exit 0
            fi

            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: HTTP $response - waiting 10s..."
            sleep 10
          done

          echo "❌ Health check failed after $max_attempts attempts"
          exit 1

  # ============================================================================
  # JOB 4: SMOKE TESTS
  # ============================================================================
  smoke-tests:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy
    # Only run after successful deployment (main branch only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Test health endpoint
        run: |
          echo "Testing health endpoint..."
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/healthz

      - name: Test main page loads
        run: |
          echo "Testing main page..."
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/

      - name: All smoke tests passed
        run: echo "✅ All smoke tests passed!"
