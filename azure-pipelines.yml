# Azure Pipelines CI/CD Configuration
# Triggers on pushes to main branch and pull requests

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/**
      - .gitignore

pr:
  branches:
    include:
      - main

variables:
  pythonVersion: '3.13'
  coverageThreshold: 70
  resourceGroup: 'BCSAI2025-DEVOPS-STUDENTS-A'
  location: 'westeurope'
  - group: InsightPilot-Production

stages:
  # ============================================================================
  # STAGE 1: BUILD & TEST
  # ============================================================================
  - stage: BuildAndTest
    displayName: 'Build and Test'
    jobs:
      - job: QualityChecks
        displayName: 'Code Quality & Testing'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          # Checkout code
          - checkout: self
            displayName: 'Checkout Repository'
          
          # Setup Python
          - task: UsePythonVersion@0
            displayName: 'Set up Python $(pythonVersion)'
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true
          
          # Install dependencies
          - script: |
              python -m pip install --upgrade pip
              pip install -e ".[dev]"
            displayName: 'Install Dependencies'
          
          # Run linters
          - script: |
              echo "Running Ruff linter..."
              ruff check app/ tests/ --output-format=github
            displayName: 'Run Ruff Linter'
            continueOnError: false
          
          - script: |
              echo "Checking code formatting..."
              black app/ tests/ --check
            displayName: 'Check Black Formatting'
            continueOnError: false
          
          - script: |
              echo "Checking import sorting..."
              isort app/ tests/ --check
            displayName: 'Check Import Sorting'
            continueOnError: false
          
          # Run tests with coverage
          - script: |
              echo "Running tests with coverage..."
              pytest \
                --cov=app \
                --cov-report=xml:coverage.xml \
                --cov-report=html:htmlcov \
                --cov-report=term \
                --junitxml=test-results.xml \
                -v
            displayName: 'Run Tests with Coverage'
            continueOnError: false
          
          # Publish test results
          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Python Tests'
          
          # Publish coverage results
          - task: PublishCodeCoverageResults@1
            displayName: 'Publish Coverage Results'
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: 'coverage.xml'
              reportDirectory: 'htmlcov'
              failIfCoverageEmpty: true
          
          # Check coverage threshold
          - script: |
              coverage_percent=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.attrib['line-rate']) * 100)")
              echo "Coverage: $coverage_percent%"
              if (( $(echo "$coverage_percent < $(coverageThreshold)" | bc -l) )); then
                echo "##vso[task.logissue type=error]Coverage $coverage_percent% is below threshold $(coverageThreshold)%"
                exit 1
              fi
              echo "✓ Coverage meets threshold"
            displayName: 'Verify Coverage Threshold ($(coverageThreshold)%)'
            continueOnError: false
          
          # Type checking (optional but recommended)
          - script: |
              echo "Running type checking..."
              mypy app/ --ignore-missing-imports || true
            displayName: 'Run MyPy Type Checking'
            continueOnError: true

  # ============================================================================
  # STAGE 2: BUILD DOCKER IMAGE
  # ============================================================================
  - stage: BuildDocker
    displayName: 'Build Docker Image'
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: DockerBuild
        displayName: 'Build and Push Docker Image'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - checkout: self
            displayName: 'Checkout Repository'
          
          # Build Docker image
          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: 'build'
              repository: '$(dockerRepository)'
              dockerfile: 'Dockerfile'
              tags: |
                $(Build.BuildId)
                latest
              arguments: '--build-arg BUILD_DATE=$(Build.BuildNumber)'
          
          # Login to Azure Container Registry (if using ACR)
          - task: Docker@2
            displayName: 'Login to Azure Container Registry'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              command: 'login'
              containerRegistry: '$(dockerRegistryServiceConnection)'
          
          # Push Docker image (only on main branch)
          - task: Docker@2
            displayName: 'Push Docker Image to ACR'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              command: 'push'
              repository: '$(dockerRepository)'
              tags: |
                $(Build.BuildId)
                latest

  # ============================================================================
  # STAGE 3: DEPLOY TO AZURE (Main branch only)
  # ============================================================================
  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: BuildDocker
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToAzure
        displayName: 'Deploy to Azure App Service'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                # Deploy to Azure Web App for Containers
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to Azure Web App'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appName: '$(webAppName)'
                    containers: '$(dockerRegistry)/$(dockerRepository):$(Build.BuildId)'
                    appSettings: |
                      -OPENAI_API_KEY "$(OPENAI_API_KEY)"
                      -DATABASE_URL "$(DATABASE_URL)"
                      -SECRET_KEY "$(SECRET_KEY)"
                      -ENVIRONMENT "production"
                
                # Health check after deployment
                - script: |
                    echo "Waiting for application to start..."
                    sleep 30
                    
                    echo "Checking health endpoint..."
                    response=$(curl -s -o /dev/null -w "%{http_code}" https://$(webAppName).azurewebsites.net/health)
                    
                    if [ $response -eq 200 ]; then
                      echo "✓ Health check passed!"
                    else
                      echo "✗ Health check failed with status code: $response"
                      exit 1
                    fi
                  displayName: 'Health Check'
                  continueOnError: false

  # ============================================================================
  # STAGE 4: POST-DEPLOYMENT VALIDATION
  # ============================================================================
  - stage: ValidationTests
    displayName: 'Post-Deployment Validation'
    dependsOn: Deploy
    condition: succeeded()
    jobs:
      - job: SmokeTests
        displayName: 'Run Smoke Tests'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - script: |
              echo "Running smoke tests against production..."
              
              # Test health endpoint
              curl -f https://$(webAppName).azurewebsites.net/health || exit 1
              
              # Test main page loads
              curl -f https://$(webAppName).azurewebsites.net/ || exit 1
              
              echo "✓ All smoke tests passed!"
            displayName: 'Smoke Tests'

