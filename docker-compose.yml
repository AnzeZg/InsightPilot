version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: insightpilot_db
    environment:
      POSTGRES_DB: insightpilot
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d insightpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - insightpilot_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insightpilot_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      SECRET_KEY: "dev-secret-key-change-in-production"
      SESSION_COOKIE_NAME: ip_session
      DATABASE_URL: postgresql+psycopg2://insight:insight@db:5432/insightpilot
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot-reload during development
      - ./app:/app/app:rw
      - ./alembic:/app/alembic:rw
      - ./alembic.ini:/app/alembic.ini:ro
    networks:
      - insightpilot_network
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  prometheus:
    image: prom/prometheus:latest
    container_name: insightpilot_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - insightpilot_network
    restart: unless-stopped
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: insightpilot_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    networks:
      - insightpilot_network
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  pgdata:
    name: insightpilot_pgdata
  prometheus_data:
    name: insightpilot_prometheus_data
  grafana_data:
    name: insightpilot_grafana_data

networks:
  insightpilot_network:
    name: insightpilot_network
    driver: bridge
